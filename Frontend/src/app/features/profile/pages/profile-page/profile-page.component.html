<div class="lg:pt-6">
  @if (loadingPerfil()) {
    <!-- Skeleton loader -->
    <div class="animate-pulse">
      <div class="h-44 w-full rounded-t-3xl bg-border"></div>
      <div class="mt-14 px-6 space-y-3">
        <div class="h-6 w-40 rounded bg-border"></div>
        <div class="h-4 w-24 rounded bg-border"></div>
        <div class="mt-4 flex gap-6">
          <div class="h-10 w-16 rounded bg-border"></div>
          <div class="h-10 w-16 rounded bg-border"></div>
          <div class="h-10 w-16 rounded bg-border"></div>
        </div>
      </div>
    </div>
  } @else if (errorPerfil()) {
    <div class="flex flex-col items-center justify-center py-20">
      <i class="mdi mdi-alert-circle-outline text-4xl text-danger"></i>
      <p class="mt-3 font-heading text-base font-semibold text-brand-text">{{ errorPerfil() }}</p>
    </div>
  } @else if (perfil()) {
    <div class="overflow-hidden rounded-3xl border border-border bg-surface shadow-sm">
      <app-profile-header
        [perfil]="perfil()!"
        [followLoading]="followLoading()"
        (editClick)="editOpen.set(true)"
        (followClick)="onFollowClick()"
        (seguidoresClick)="openSeguidoresModal()"
        (seguidosClick)="openSeguidosModal()"
      />
    </div>

    <!-- Divider -->
    <div class="mt-5 mb-4 border-t border-border"></div>

    <!-- Posts grid -->
    <app-profile-posts-grid
      [posts]="posts()"
      [loading]="loadingPosts()"
      [hasMore]="hasMore()"
      (loadMore)="loadPosts()"
    />
  }
</div>

<!-- Edit modal -->
@if (editOpen() && perfil()) {
  <app-edit-profile-modal
    [perfil]="perfil()!"
    (closed)="onEditClosed($event)"
  />
}

@if (followModalMode() && perfil()) {
  <app-follow-list-modal
    [username]="perfil()!.username"
    [mode]="followModalMode()!"
    (closed)="followModalMode.set(null)"
  />
}
