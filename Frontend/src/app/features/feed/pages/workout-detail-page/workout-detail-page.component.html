<section class="mt-4 pb-8">
  <button
    type="button"
    class="mb-4 inline-flex cursor-pointer items-center gap-1 text-sm font-medium text-muted hover:text-primary-dark"
    (click)="goBack()"
  >
    <i class="mdi mdi-arrow-left text-lg"></i>
    Volver
  </button>

  @if (loading()) {
    <div class="animate-pulse space-y-3 rounded-2xl border border-border bg-surface p-4 shadow-sm">
      <div class="h-4 w-32 rounded bg-border"></div>
      <div class="h-6 w-2/3 rounded bg-border"></div>
      <div class="h-4 w-1/2 rounded bg-border"></div>
    </div>
  } @else if (errorMessage()) {
    <p class="rounded-xl bg-red-50 px-4 py-3 text-sm text-danger">{{ errorMessage() }}</p>
  } @else if (post(); as p) {
    <article class="overflow-hidden rounded-2xl border border-border bg-surface shadow-sm">
      <app-workout-detail-header [post]="p" />

      @if (hasMedia) {
        <div class="border-t border-border">
          <app-workout-detail-media [multimediaUrl]="p.multimediaUrl!" />
        </div>
      }

      @if (p.ejercicios.length > 0) {
        <app-workout-detail-exercises [ejercicios]="p.ejercicios" />
      }

      <div class="flex items-center gap-4 border-t border-border px-4 py-3">
        <button
          type="button"
          (click)="toggleLike()"
          [disabled]="liking()"
          class="flex items-center gap-1.5 rounded-full text-sm transition-colors hover:text-danger disabled:cursor-not-allowed disabled:opacity-60"
          [class.text-danger]="p.meGusta"
          [class.text-muted]="!p.meGusta"
          [attr.aria-label]="p.meGusta ? 'Quitar like' : 'Dar like'"
        >
          <i class="mdi text-base" [class.mdi-heart]="p.meGusta" [class.mdi-heart-outline]="!p.meGusta"></i>
          {{ p.contadorLikes }}
        </button>
        <button
          type="button"
          (click)="openComments()"
          class="flex items-center gap-1.5 rounded-full text-sm text-muted transition-colors hover:text-brand-blue"
          aria-label="Ver comentarios"
        >
          <i class="mdi mdi-comment-outline text-base"></i>
          {{ p.contadorComentarios }}
        </button>
      </div>
    </article>

    @if (commentsOpen()) {
      <app-comments-modal
        [post]="p"
        (closed)="closeComments()"
        (commentCreated)="onCommentCreated()"
        (commentDeleted)="onCommentDeleted()"
      />
    }
  }
</section>
