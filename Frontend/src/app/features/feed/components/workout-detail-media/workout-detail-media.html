<div class="px-4 pb-4">
  <div class="overflow-hidden rounded-xl border border-border bg-ice/50">
    @if (isVideo) {
      <video [src]="multimediaUrl" controls class="max-h-[28rem] w-full object-contain"></video>
    } @else {
      <img [src]="multimediaUrl" alt="Multimedia publicación" class="max-h-[28rem] w-full object-contain" />
    }
  </div>
</div>
