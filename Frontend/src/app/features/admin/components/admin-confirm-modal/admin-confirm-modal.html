<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4"
  (click)="cancelled.emit()"
>
  <div
    class="w-full max-w-sm overflow-hidden rounded-2xl bg-surface shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-5">
      <h3 class="font-heading text-lg font-semibold text-brand-text">{{ title }}</h3>
      <p class="mt-2 text-sm text-muted">{{ message }}</p>
    </div>
    <div class="flex gap-3 border-t border-border px-6 py-4">
      <button
        type="button"
        (click)="cancelled.emit()"
        [disabled]="loading"
        class="flex-1 rounded-xl border border-border py-2 text-sm font-semibold text-brand-text transition-colors hover:bg-ice disabled:opacity-60 cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="confirmed.emit()"
        [disabled]="loading"
        class="flex-1 rounded-xl bg-danger py-2 text-sm font-semibold text-white transition-colors hover:opacity-90 disabled:opacity-60 cursor-pointer"
      >
        {{ loading ? 'Procesando…' : confirmLabel }}
      </button>
    </div>
  </div>
</div>
