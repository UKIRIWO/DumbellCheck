<main class="min-h-screen w-full pb-20 pt-6 lg:pb-0 lg:pt-0">
  <div class="mx-auto w-full max-w-md px-4 lg:max-w-none lg:flex lg:items-start lg:px-0">
    <aside class="hidden lg:sticky lg:top-0 lg:block lg:h-screen lg:w-[20vw] lg:self-start lg:shrink-0">
      @if (isAdminRoute()) {
        <app-admin-side-nav />
      } @else {
        <app-side-nav />
      }
    </aside>

    <section
      class="lg:ml-[5vw] lg:shrink-0"
      [class.lg:w-[45vw]]="!hideSidebar()"
      [class.lg:w-[70vw]]="hideSidebar()"
      [class.lg:mr-[5vw]]="hideSidebar()"
    >
      <router-outlet />
    </section>

    @if (!hideSidebar()) {
      <aside class="hidden lg:ml-[3vw] lg:mr-[2vw] lg:block lg:w-[25vw] lg:shrink-0 lg:self-stretch">
        <app-feed-right-sidebar />
      </aside>
    }
  </div>
</main>

@if (!isAdminRoute()) {
  <div class="lg:hidden">
    <app-bottom-nav />
  </div>
}
