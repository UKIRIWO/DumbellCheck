<div class="relative">
  <input
    [id]="inputId"
    [type]="visible() ? 'text' : 'password'"
    [formControl]="control"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete"
    [class]="fieldBaseClass + ' ' + (size === 'sm' ? sizeSmClass : sizeMdClass)"
  />
  <button
    type="button"
    class="absolute right-2.5 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-md text-muted transition hover:bg-sky/10 hover:text-charcoal focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue"
    (click)="toggle()"
    [attr.aria-label]="visible() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
    [attr.aria-pressed]="visible()"
  >
    @if (visible()) {
      <i class="mdi mdi-eye-off-outline text-lg leading-none" aria-hidden="true"></i>
    } @else {
      <i class="mdi mdi-eye-outline text-lg leading-none" aria-hidden="true"></i>
    }
  </button>
</div>
