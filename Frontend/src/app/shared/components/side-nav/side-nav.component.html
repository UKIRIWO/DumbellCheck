<div class="flex h-full flex-col justify-between bg-white border-r border-border">
  <div class="space-y-5 p-4">
    <a routerLink="/" class="flex items-center gap-2">
      <img src="assets/logoApp/logo_low_poly.png" alt="DumbellCheck" class="h-6" />
      <h1 class="text-xl font-bold ml-1">DumbellCheck</h1>
    </a>
    <app-user-search />

    <nav class="space-y-3 mt-3">
      <a routerLink="/app/feed" routerLinkActive="bg-ice text-primary-dark"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-brand-text transition-colors hover:bg-ice">
        <i class="mdi mdi-home-outline text-2xl"></i>
        <p class="text-lg ml-2">Feed</p>
      </a>

      <a routerLink="/app/routines" routerLinkActive="bg-ice text-primary-dark"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-brand-text transition-colors hover:bg-ice">
        <i class="mdi mdi-dumbbell text-2xl"></i>
        <p class="text-lg ml-2">Rutinas</p>
      </a>

      <a routerLink="/app/stats" routerLinkActive="bg-ice text-primary-dark"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-brand-text transition-colors hover:bg-ice">
        <i class="mdi mdi-chart-bar text-2xl"></i>
        <p class="text-lg ml-2">Estadísticas</p>
      </a>

      <a routerLink="/app/profile" routerLinkActive="bg-ice text-primary-dark"
        class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-brand-text transition-colors hover:bg-ice">
        <i class="mdi mdi-account-outline text-2xl"></i>
        <p class="text-lg ml-2">Perfil</p>
      </a>

      @if (isAdmin()) {
        <a routerLink="/app/admin" routerLinkActive="bg-ice text-primary-dark"
          class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium text-brand-text transition-colors hover:bg-ice">
          <i class="mdi mdi-shield-crown-outline text-2xl"></i>
          <p class="text-lg ml-2">Admin</p>
        </a>
      }
    </nav>
  </div>

  <div class="border-t border-border p-4">
    <div class="flex items-center gap-3">
      <a [routerLink]="profileLink()" class="shrink-0" [attr.aria-label]="'Ver tu perfil'">
        <app-user-avatar size="md" [username]="username()" [fotoPerfilUrl]="fotoPerfilUrl()" />
      </a>
      <div class="min-w-0 flex-1 flex items-center justify-between gap-2">
        <a [routerLink]="profileLink()"
          class="truncate font-heading text-sm font-semibold text-brand-text hover:underline">
          {{ username() }}
        </a>
        <div class="flex shrink-0 items-center">
          <app-logout-confirm-button buttonIconClass="mdi mdi-logout-variant text-lg"
            buttonClass="flex h-9 w-9 items-center justify-center rounded-full bg-ice text-brand-blue hover:bg-sky/40 transition-colors" />
        </div>
      </div>
    </div>
  </div>
</div>
