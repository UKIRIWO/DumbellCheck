<div
  class="accessibility-widget-root fixed-fab-left z-[60]"
  [class.fixed-fab-left--in-app]="inAppLayout()"
>
  <button
    type="button"
    class="accessibility-fab flex h-14 w-14 cursor-pointer items-center justify-center rounded-full bg-brand-blue text-white shadow-lg transition-colors hover:bg-blueDark focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-warning"
    (click)="togglePanel($event)"
    [attr.aria-expanded]="panelOpen()"
    aria-controls="accessibility-panel"
    aria-label="Opciones de accesibilidad"
    title="Opciones de accesibilidad"
  >
    <i class="mdi mdi-wheelchair-accessibility text-2xl" aria-hidden="true"></i>
  </button>

  @if (panelOpen()) {
    <div
      id="accessibility-panel"
      role="dialog"
      aria-label="Panel de accesibilidad"
      class="absolute bottom-[calc(100%+0.75rem)] left-0 w-[min(20rem,calc(100vw-1.5rem))] rounded-2xl border border-border bg-surface p-4 shadow-xl"
    >
      <h3 class="mb-3 flex items-center gap-2 font-heading text-base font-bold text-brand-text">
        <i class="mdi mdi-wheelchair-accessibility text-xl text-primary-dark" aria-hidden="true"></i>
        Accesibilidad
      </h3>

      <section class="mb-4 space-y-2">
        <p class="flex items-center gap-2 text-sm font-semibold text-brand-text">
          <i class="mdi mdi-format-size text-lg text-muted" aria-hidden="true"></i>
          Tamaño de letra:
          <span class="font-normal text-muted">{{ state().tamano }}%</span>
        </p>
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="flex cursor-pointer items-center gap-1.5 rounded-lg border border-border bg-ice px-3 py-1.5 text-sm font-medium text-brand-text transition-colors hover:bg-surface"
            (click)="a11y.decreaseFontSize()"
          >
            <i class="mdi mdi-format-font-size-decrease text-lg" aria-hidden="true"></i>
            −10%
          </button>
          <button
            type="button"
            class="flex cursor-pointer items-center gap-1.5 rounded-lg border border-border bg-ice px-3 py-1.5 text-sm font-medium text-brand-text transition-colors hover:bg-surface"
            (click)="a11y.resetFontSize()"
          >
            <i class="mdi mdi-restore text-lg" aria-hidden="true"></i>
            100%
          </button>
          <button
            type="button"
            class="flex cursor-pointer items-center gap-1.5 rounded-lg border border-border bg-ice px-3 py-1.5 text-sm font-medium text-brand-text transition-colors hover:bg-surface"
            (click)="a11y.increaseFontSize()"
          >
            <i class="mdi mdi-format-font-size-increase text-lg" aria-hidden="true"></i>
            +10%
          </button>
        </div>
      </section>

      <section class="mb-4 space-y-2">
        <p class="text-sm font-semibold text-brand-text">Opciones:</p>
        <ul class="space-y-2">
          @for (opt of optionKeys; track opt.key) {
            <li>
              <label class="flex cursor-pointer items-center gap-2 text-sm text-brand-text">
                <input
                  type="checkbox"
                  class="h-4 w-4 cursor-pointer accent-primary-dark"
                  [checked]="isOptionChecked(opt.key)"
                  (change)="onOptionChange(opt.key, $event)"
                />
                <i [class]="'mdi ' + opt.icon + ' text-lg text-muted'" aria-hidden="true"></i>
                {{ opt.label }}
              </label>
            </li>
          }
        </ul>
      </section>

      <button
        type="button"
        class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-blueDark"
        (click)="a11y.resetAll()"
      >
        <i class="mdi mdi-refresh text-lg" aria-hidden="true"></i>
        Restablecer todo
      </button>
    </div>
  }
</div>
