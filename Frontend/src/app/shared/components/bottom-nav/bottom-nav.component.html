    <li>

    </li>
    <li>

      >

      </a>
    </li>
    <li>
      <a
        routerLink="/app/chats"
        routerLinkActive="text-primary-dark"
        class="flex flex-col items-center gap-0.5 rounded-xl px-2 py-1 text-muted transition-colors hover:text-primary-dark"

      >
        <i class="mdi mdi-message-outline text-2xl" aria-hidden="true"></i>
      </a>
    </li>
    <li>

      </a>

    <li>
